<svg fill="none" viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          background: #0d1117;
          height: 400px; border-radius: 24px; overflow: hidden; position: relative;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          font-family: 'Inter', -apple-system, system-ui, sans-serif;
        }
        .mesh {
          position: absolute; width: 100%; height: 100%;
          background-image: 
            radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0, transparent 50%), 
            radial-gradient(at 100% 100%, rgba(20, 184, 166, 0.15) 0, transparent 50%);
        }
        .glitch-title {
          font-size: 64px; font-weight: 900; color: #fff; letter-spacing: -4px;
          background: linear-gradient(180deg, #fff 30%, rgba(255,255,255,0.2) 100%);
          -webkit-background-clip: text; -webkit-text-fill-color: transparent;
          z-index: 1; margin: 0;
        }
        .status-pill {
          background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
          padding: 6px 16px; border-radius: 100px; color: #8b949e;
          font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
          margin-top: 20px; backdrop-filter: blur(10px);
        }
      </style>
      <div class="container">
        <div class="mesh"></div>
        <h1 class="glitch-title">Athul S Menon</h1>
        <div class="status-pill">Front-end Developer • Linux Enthusiast</div>
      </div>
    </div>
  </foreignObject>
</svg>
