<svg fill="none" viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .canvas {
          background: #0d1117;
          display: flex; justify-content: center; align-items: center;
          height: 400px; border-radius: 20px; overflow: hidden; position: relative;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .orbit {
          position: absolute; border: 1px solid rgba(255,255,255,0.05); border-radius: 50%;
          animation: rotate var(--d) linear infinite;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .core {
          width: 120px; height: 120px; background: radial-gradient(circle, #6366f1 0%, #a855f7 100%);
          filter: blur(40px); opacity: 0.6; animation: pulse 4s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.5); opacity: 0.7; } }
        .text-overlay {
          z-index: 10; text-align: center;
        }
        .title {
          font-size: 56px; font-weight: 900; letter-spacing: -3px; color: #fff; margin: 0;
          background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.4) 100%);
          -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle {
          color: #8b949e; font-size: 14px; letter-spacing: 5px; text-transform: uppercase; margin-top: 10px;
        }
      </style>
      <div class="canvas">
        <div class="orbit" style="width: 300px; height: 300px; --d: 15s;"></div>
        <div class="orbit" style="width: 500px; height: 500px; --d: 25s;"></div>
        <div class="core"></div>
        <div class="text-overlay">
          <div class="title">Athul S Menon<br/>Engineer</div>
          <div class="subtitle">Developer • Intelligence</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
