<svg fill="none" viewBox="0 0 800 300" width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes rotate {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes pulse {
          0%, 100% { opacity: 0.5; }
          50% { opacity: 0.8; }
        }
        .container {
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          height: 300px;
          background: #0d1117;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
          overflow: hidden;
          border-radius: 12px;
        }
        .grid {
          position: absolute;
          width: 200%;
          height: 200%;
          background-image: radial-gradient(circle, #30363d 1px, transparent 1px);
          background-size: 30px 30px;
          opacity: 0.2;
          transform: rotate(15deg);
        }
        .glass-blob {
          position: absolute;
          width: 400px;
          height: 400px;
          background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(20, 184, 166, 0.05) 100%);
          filter: blur(60px);
          border-radius: 50%;
          animation: rotate 20s linear infinite;
        }
        .content {
          position: relative;
          z-index: 10;
          text-align: center;
        }
        h1 {
          font-size: 42px;
          font-weight: 800;
          letter-spacing: -2px;
          color: #f0f6fc;
          margin: 0;
          background: linear-gradient(135deg, #fff 0%, #8b949e 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
        p {
          font-size: 16px;
          color: #8b949e;
          letter-spacing: 4px;
          text-transform: uppercase;
          margin-top: 10px;
          animation: pulse 4s ease-in-out infinite;
        }
      </style>
      <div class="container">
        <div class="grid"></div>
        <div class="glass-blob"></div>
        <div class="content">
          <h1>ARCHITECTING SYSTEMS</h1>
          <p>Full-Stack • UI/UX • AI Solutions</p>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
